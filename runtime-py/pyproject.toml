[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bantamkit"
dynamic = ["version"]
description = "Memory MCP server for Claude Code, Cursor, VS Code Copilot and Claude Desktop, plus a Python library that lifts small-model agents. Install once, run offline."
readme = "README.md"
requires-python = ">=3.11"
# J52-4, 2026-09-15. The same keyword set as `runtime-ts/package.json`, so both registries
# are searched by the same words. Every one names something the package does.
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "claude",
    "claude-code",
    "claude-desktop",
    "cursor",
    "copilot",
    "vscode",
    "agent",
    "memory",
    "json-schema",
    "llm",
]
# Python versions are the CI matrix in .github/workflows/ci.yml. No License classifier:
# PEP 639 forbids one beside the `license` expression below.
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# U9, 2026-08-24. THE SPELLING IS MEASURED, not copied from a changelog. `runtime-ts/
# package.json` has declared `"license": "MIT"` since it existed, against a `LICENSE`
# file that did not exist and a Python half that declared nothing at all. This line is
# the Python half of that declaration; the text now sits at the REPOSITORY root.
#
# Two spellings are ACCEPTED by hatchling 1.31.0 and they do not mean the same thing —
# built and read back out of `bantamkit-0.25.0-py3-none-any.whl`:
#
#   license = "MIT"          ->  Metadata-Version: 2.4, `License-Expression: MIT`
#   license = {text = "MIT"} ->  Metadata-Version: 2.4, `License: MIT`
#
# The second is the pre-PEP-639 free-text field, deprecated by that PEP in favour of the
# SPDX expression. Both build clean, so the build cannot tell you which you meant; only
# reading the metadata can. The SPDX form is the one kept.
#
# NO `license-files` HERE, and this is the trap worth naming: the licence lives one
# level ABOVE this project root, so the obvious `license-files = ["../LICENSE"]` is what
# a reader reaches for. hatchling ACCEPTS IT AND BUILDS 0 — and MEASURED, the wheel it
# produces carries `License-File: ../LICENSE` and a zip member literally named
# `bantamkit-0.25.0.dist-info/licenses/../LICENSE`, a traversal path that escapes
# dist-info on unpack. A wrong spelling accepted by the build is exactly the failure
# mode this comment exists to stop. The expression alone is the declaration; the text is
# at the repository root, and `tests/test_packaging.py` asserts the expression in both
# the wheel's METADATA and the sdist's PKG-INFO.
license = "MIT"
dependencies = ["httpx>=0.27", "jsonschema>=4.21", "pyyaml>=6.0"]

[project.optional-dependencies]
# RB-P85: `hatchling` is the build backend, and the packaging bar
# (tests/test_packaging.py) builds a real sdist and a real wheel through it. Pip
# installs the backend into an isolated build env, never into the target env, so
# without this declaration the bar would silently skip in exactly the environment
# CI runs (`pip install -e "runtime-py[dev,mcp]"`). Declared here so it runs.
dev = ["pytest>=8.0", "ruff>=0.4", "hatchling>=1.24"]
# Upper bound measured, not guessed: 2.0.0 and 2.0.1 wrap a tool crash as
# `Error executing tool <name>: <exc>`, which runtime-ts/src/mcp/server.ts mirrors.
# 2.1.0 added an UnexpectedToolError branch that drops the `: <exc>` suffix, so the
# crash text stops reaching the client and `--suite workplan` goes red on the
# reference while the port still carries it. Raise this only together with the port.
mcp = ["mcp>=2.0,<2.1"]

[project.scripts]
bantamkit-mcp = "bantamkit.mcpserver:main"

[project.urls]
Homepage = "https://github.com/Ink01101011/bantamkit"
Repository = "https://github.com/Ink01101011/bantamkit"
Issues = "https://github.com/Ink01101011/bantamkit/issues"
Documentation = "https://github.com/Ink01101011/bantamkit/tree/main/docs"

# RB-P45. Read the version out of the package instead of restating it here, so the
# version a running server reports is a property of the checkout and not of the last
# install. The number itself is unchanged; only where it is declared has moved.
[tool.hatch.version]
path = "src/bantamkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bantamkit"]

# RB-P85. The asset pack sits at the REPOSITORY root, outside this project's root, so
# it cannot be named by a static path that survives packing: `"../assets"` here built a
# wheel in place but produced an sdist silently short of the pack, and a wheel built
# FROM that sdist could not be built at all. `hatch_build.py` locates the pack instead
# — vendored at `_assets/` inside an sdist, `../assets` in a checkout — and raises when
# it finds neither, so a build that cannot bundle the pack fails rather than shipping
# short. Both targets run the same hook; see runtime-py/hatch_build.py.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

# MS5, 2026-08-23. THE ONE MARKER IN THIS SUITE, and the only `addopts` line, so read
# both together: the default run of this suite DOES NOT COMPARE THE TWO REAL MEMORY
# STORES ON THIS MACHINE. It is deselected, not skipped and not passed -- pytest prints
# `1 deselected` and makes no claim about it.
#
# WHY. `tests/test_memory_store_tripwire.py::test_the_two_real_memory_stores_have_not_
# drifted_apart` is a hard assertion about MACHINE STATE, not about the diff under test,
# and MS4 measured the mechanism that makes that state move on its own: no `runtime-py`
# source writes `~/.claude`, so the bantamkit MCP writes only `<repo>/.bantamkit/memory`
# and Claude Code's auto-memory writes only the native store. EVERY `memory_save`
# diverges the pair by +1 until a human mirrors it -- and this program's mandated
# workflow is one job per context, write memory, clear. Left in the default run, that
# node charges every unrelated unit in the repo with a red about the user's memory store
# that its diff did not cause; it already did, to the unit that wrote the node, which
# then wrote into the user's live store to get green.
#
# WHY NOT SOFTEN IT INSTEAD. The alternative was to keep it selected and downgrade the
# failure to a printed report. That leaves a node that is GREEN while the stores
# disagree, and a green that means nothing is the exact defect the whole gate exists to
# prevent. So the node keeps its hard fail and gives up its seat in the default run.
#
# WHO RUNS IT. The memory job and the shift closeout, with:
#   PYTHONPATH=runtime-py/src .venv/bin/python -m pytest runtime-py/tests -m realpair
# That command is pinned by `test_the_realpair_arrangement_is_the_one_documented_here`,
# which reads THIS FILE, so it cannot rot into a comment nobody re-derives.
markers = [
    """\
realpair: compares the two real memory stores on THIS machine. Deselected by default \
because its outcome is a function of machine state, not of the diff. Run it with: \
PYTHONPATH=runtime-py/src .venv/bin/python -m pytest runtime-py/tests -m realpair""",
]
addopts = ["-m", "not realpair"]
# L6, 2026-08-14 (L5's I6). Both permanent `xfail`s were NON-STRICT, so they could go
# red neither by failing nor by passing — inert in both directions, while contributing
# "2 xfailed" to a headline that reads as coverage. Strict makes the passing direction
# a failure, and for these two that direction is worth exactly one thing: both assert
# facts about COMMITTED bytes, which by invariant are never regenerated, so an xpass
# means the frozen record moved. That is the byte-identity floor being breached, and a
# red suite is the right answer to it. The failing direction stays inert and no setting
# can change that — see the note on each marker, and L5's diagnosis: the real defect is
# that they assert facts about the world (RB-P14 Gate 2), which is filed, not fixed.
xfail_strict = true

# W1, 2026-08-22. The Windows-portability class: 259 executing call sites opened a text
# file without naming an encoding, so what they read was `locale.getencoding()` -- utf-8
# here, cp1252/cp932/cp936 on a Windows runner. This filter is the half of the gate that
# TURNS A VIOLATION RED. It is not the whole gate and on its own it is VACUOUS, because
# `EncodingWarning` is only ever emitted when the interpreter was started with
# `-X warn_default_encoding` / `PYTHONWARNDEFAULTENCODING=1`.
#
# MEASURED: `-X` cannot be delivered from here. `addopts = "-X warn_default_encoding"`
# makes pytest exit 4 with `error: unrecognized arguments: -X` -- it is an interpreter
# flag, parsed before pytest exists, not a pytest flag. So the emitting half lives in the
# environment (`env: PYTHONWARNDEFAULTENCODING` in .github/workflows/ci.yml) and
# `tests/test_encoding_gate.py` is what stops that env line from being deleted silently.
# W14, 2026-08-22. THE SECOND FAILING HALF, and unlike W1's it needs no second file.
#
# WHAT IT CATCHES. On Windows `subprocess` decodes a captured stream inside a DAEMON
# READER THREAD (`_readerthread`, subprocess.py:1599, `buffer.append(fh.read())`). A
# `UnicodeDecodeError` there dies WITH THE THREAD: the `join()` returns normally, the
# buffer is left empty, and `communicate()` hands back `stdout=None` beside an intact
# `returncode` and an intact `stderr`. pytest notices -- `threadexception.py` turns it
# into `PytestUnhandledThreadExceptionWarning` -- and then files it in the warnings
# summary, where a node that never touches the lost stream STAYS GREEN.
#
# MEASURED, CI run 32555258828, windows-latest 3.11 and 3.12, 6 dead reader threads per
# job on 6 nodes -- and ON THAT RUN THIS LINE WOULD HAVE CAUGHT NOTHING NEW. All six
# landed on nodes that were ALREADY RED (5 FAILED + 1 ERROR at setup). The gate's value
# on that particular run was zero, and the sentence that used to stand here said the
# opposite.
#
# WHAT USED TO STAND HERE, AND WHY IT IS GONE (`RB-P102`). It claimed the sixth node,
# `test_amendguard.py::test_a_pointer_fix_bundled_with_anything_else_is_pointer_not_isolated`,
# REPORTED PASS while its fixture read rows from the `--out` file. Both halves are false:
# that node ERRORED at setup -- it is one of the run's 20 errors -- and its fixture at
# `f2b9078` passes no `--out` at all and builds every row from `r.stdout.splitlines()`,
# which is precisely the `AttributeError` in the traceback. The author searched the
# `FAILED` list, did not find the node there, and inferred a pass -- the same log-reading
# trap that unit had been sent to correct, committed into a justification comment one
# round later. Recorded rather than quietly deleted, because the failure mode is the
# point: an anecdote is the part of a justification nobody re-derives.
#
# SO WHY KEEP THE LINE. Not for the anecdote -- for the mechanism above, which is real
# and is pinned by `tests/test_thread_exception_gate.py` measured in both directions
# (remove this string and 2 nodes go red; weaken `error::` to `default::` and the same 2
# go red). A dead capture thread CAN leave a node green whenever the node's assertions
# do not depend on the stream that was lost. That has not yet been observed here; the
# gate is armed against it rather than after it, and this comment now says which.
#
# WHY HERE AND NOT ON THE `Test` LINE IN .github/workflows/ci.yml. W1's gate had to be
# split across two files because its emitting half is `-X warn_default_encoding`, an
# INTERPRETER flag that pytest's `addopts` cannot carry (it exits 4 on it). THAT
# CONSTRAINT DOES NOT APPLY HERE: pytest's `threadexception` plugin emits this warning
# unconditionally, with no flag, so there is no emitting half to place and only the
# failing half exists. Putting it in the workflow instead would arm it in CI ONLY -- and
# a developer reproducing a Windows failure locally would get the same silent green that
# hid the sixth node for a whole job. One list, one behaviour, every machine.
filterwarnings = [
    "error::EncodingWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bantamkit/__init__.py" = ["F401"]  # package re-exports
"src/bantamkit/memory/__init__.py" = ["F401"]  # package re-exports
