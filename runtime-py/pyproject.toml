[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bantamkit"
version = "0.14.0"
description = "bantamweight tooling — harness primitives that lift small-model agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jsonschema>=4.21", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
bantamkit-mcp = "bantamkit.mcpserver:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bantamkit"]

[tool.hatch.build.targets.wheel.force-include]
"../assets" = "bantamkit/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bantamkit/__init__.py" = ["F401"]  # package re-exports
"src/bantamkit/memory/__init__.py" = ["F401"]  # package re-exports
