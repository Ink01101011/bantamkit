[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bantamkit"
dynamic = ["version"]
description = "bantamweight tooling — harness primitives that lift small-model agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "jsonschema>=4.21", "pyyaml>=6.0"]

[project.optional-dependencies]
# RB-P85: `hatchling` is the build backend, and the packaging bar
# (tests/test_packaging.py) builds a real sdist and a real wheel through it. Pip
# installs the backend into an isolated build env, never into the target env, so
# without this declaration the bar would silently skip in exactly the environment
# CI runs (`pip install -e "runtime-py[dev,mcp]"`). Declared here so it runs.
dev = ["pytest>=8.0", "ruff>=0.4", "hatchling>=1.24"]
mcp = ["mcp>=2.0,<3"]

[project.scripts]
bantamkit-mcp = "bantamkit.mcpserver:main"

# RB-P45. Read the version out of the package instead of restating it here, so the
# version a running server reports is a property of the checkout and not of the last
# install. The number itself is unchanged; only where it is declared has moved.
[tool.hatch.version]
path = "src/bantamkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bantamkit"]

# RB-P85. The asset pack sits at the REPOSITORY root, outside this project's root, so
# it cannot be named by a static path that survives packing: `"../assets"` here built a
# wheel in place but produced an sdist silently short of the pack, and a wheel built
# FROM that sdist could not be built at all. `hatch_build.py` locates the pack instead
# — vendored at `_assets/` inside an sdist, `../assets` in a checkout — and raises when
# it finds neither, so a build that cannot bundle the pack fails rather than shipping
# short. Both targets run the same hook; see runtime-py/hatch_build.py.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# L6, 2026-08-14 (L5's I6). Both permanent `xfail`s were NON-STRICT, so they could go
# red neither by failing nor by passing — inert in both directions, while contributing
# "2 xfailed" to a headline that reads as coverage. Strict makes the passing direction
# a failure, and for these two that direction is worth exactly one thing: both assert
# facts about COMMITTED bytes, which by invariant are never regenerated, so an xpass
# means the frozen record moved. That is the byte-identity floor being breached, and a
# red suite is the right answer to it. The failing direction stays inert and no setting
# can change that — see the note on each marker, and L5's diagnosis: the real defect is
# that they assert facts about the world (RB-P14 Gate 2), which is filed, not fixed.
xfail_strict = true

# W1, 2026-08-22. The Windows-portability class: 259 executing call sites opened a text
# file without naming an encoding, so what they read was `locale.getencoding()` -- utf-8
# here, cp1252/cp932/cp936 on a Windows runner. This filter is the half of the gate that
# TURNS A VIOLATION RED. It is not the whole gate and on its own it is VACUOUS, because
# `EncodingWarning` is only ever emitted when the interpreter was started with
# `-X warn_default_encoding` / `PYTHONWARNDEFAULTENCODING=1`.
#
# MEASURED: `-X` cannot be delivered from here. `addopts = "-X warn_default_encoding"`
# makes pytest exit 4 with `error: unrecognized arguments: -X` -- it is an interpreter
# flag, parsed before pytest exists, not a pytest flag. So the emitting half lives in the
# environment (`env: PYTHONWARNDEFAULTENCODING` in .github/workflows/ci.yml) and
# `tests/test_encoding_gate.py` is what stops that env line from being deleted silently.
filterwarnings = ["error::EncodingWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bantamkit/__init__.py" = ["F401"]  # package re-exports
"src/bantamkit/memory/__init__.py" = ["F401"]  # package re-exports
