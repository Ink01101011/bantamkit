name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# DIAGNOSTIC ONLY -- not a fix, and must not survive into main.
# Round 1 on windows-latest died during COLLECTION on the first file that
# read a non-ASCII byte through a text open() with no encoding= (cp1252 is
# the Windows default). One file stopping collection means the run reported
# exactly one problem and hid every other one behind it. PYTHONUTF8=1 forces
# UTF-8 everywhere so the rest of the failures become visible in a single
# run. The real repo has 277 encoding-less text-I/O sites; masking them here
# answers "what ELSE breaks on Windows", it does not repair anything.
env:
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The perturbation bar reads rubric variants as `git:<ref>:<path>`, and its
          # tests pin real refs (d2f78b7, e57f1a6). A depth-1 checkout has neither, so
          # those tests either fail outright or silently skip the thing they exist to
          # check. Full history is the only way CI actually runs them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "runtime-py[dev,mcp]"
      - name: Lint package
        run: ruff check .
        working-directory: runtime-py
      - name: Lint examples
        run: ruff check --config runtime-py/pyproject.toml examples
      - name: Test
        run: python -m pytest runtime-py -q --continue-on-collection-errors
