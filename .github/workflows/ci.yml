name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # W1: the emitting half of the encoding gate. `EncodingWarning` is raised only when
    # the interpreter is started with this on, and it CANNOT be set from pytest's
    # `addopts` (`-X` is an interpreter flag; pytest exits 4 on it). `filterwarnings` in
    # runtime-py/pyproject.toml turns what this emits into a failure, and
    # tests/test_encoding_gate.py goes red if this line is ever removed from a CI run --
    # without that node, deleting this line would leave the whole gate green and blind.
    env:
      PYTHONWARNDEFAULTENCODING: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The perturbation bar reads rubric variants as `git:<ref>:<path>`, and its
          # tests pin real refs (d2f78b7, e57f1a6). A depth-1 checkout has neither, so
          # those tests either fail outright or silently skip the thing they exist to
          # check. Full history is the only way CI actually runs them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "runtime-py[dev,mcp]"
      - name: Lint package
        run: ruff check .
        working-directory: runtime-py
      - name: Lint examples
        run: ruff check --config runtime-py/pyproject.toml examples
      - name: Test
        run: python -m pytest runtime-py -q
