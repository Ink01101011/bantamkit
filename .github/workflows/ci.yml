name: ci

on:
  push:
    branches: [main]
  pull_request:
  # ON DEMAND. The workflow spent 2026-09-04 to 2026-09-05 in `disabled_manually` and
  # nothing said so: pushes to main created no run at all, which reads exactly like a repo
  # with no CI rather than one whose CI is switched off. Without a manual trigger the only
  # way to ask "does CI work now" is to push a commit, so the question costs a commit every
  # time. `gh workflow run ci.yml` answers it for free.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # W10: the matrix is ARMED, and arming it is the whole point of job 31.
    #
    # WHAT THIS BUYS. The nine fix units closed 24 collected Windows-suspect node ids.
    # Three of them -- and only three -- were closed by `skipif`, because Windows cannot
    # be put into the scenario at all (see the `windows_cannot_construct` marker in
    # runtime-py/tests/conftest.py, where each skip is priced by what it thereby fails to
    # measure, per RB-P51). The other 21 were left DELIBERATELY LIVE. Their Windows
    # outcome has never been measured post-fix -- not once, by anyone. The 61-failure
    # reading everyone quotes was taken on probe/windows-ci BEFORE those nine fixes
    # landed, so it is not evidence about the code that runs here. This matrix is the
    # first measurement those 21 nodes have ever had, which means a red among them is a
    # READING, not a regression: the run is telling us something about Windows that no
    # amount of reasoning off the source was going to settle. Read it before fixing it.
    #
    # WHAT IS DELIBERATELY ABSENT. No PYTHONUTF8, no -X utf8, no
    # --continue-on-collection-errors. Those three exist on probe/windows-ci and that
    # branch must never merge.
    #
    # THE REASON WRITTEN HERE USED TO BE WRONG, and it was wrong in the direction that
    # flatters the gate. It said PYTHONUTF8 "makes the encoding gate pass by fiat". It
    # does not: MEASURED with three probes, EncodingWarning is still emitted under
    # PYTHONUTF8=1 and under -X utf8, so the gate keeps firing and keeps failing the run.
    # What the mask actually does is force every unencoded text open() to utf-8, which
    # hides the class's SYMPTOMS -- the cp1252 decode failures that are the whole reason
    # this job existed -- while leaving the gate itself intact. Excluding the mask is
    # still right; the argument for excluding it was not. A justification that overstates
    # its own gate is how a gate stops being re-checked.
    #
    # The mask is not the fix; the fix is the fix.
    #
    # HOW TO TELL THIS RAN. Four green jobs are only evidence if the Windows steps could
    # have gone red. Confirm from the log, not from the colour: each Windows job's Test
    # step must print a pytest summary line with a nonzero passed count. GitHub's pwsh
    # wrapper propagates $LASTEXITCODE, so a nonzero pytest exit does fail the step -- but
    # a step that never ran prints no summary at all, and that is what to look for.
    runs-on: ${{ matrix.os }}
    # A HANG IS A MEASURED FAILURE MODE HERE, NOT A HYPOTHETICAL, so both jobs carry a
    # deadline. On 2026-09-05 `node tools/conformance/run.mjs --all` ran for 1h09m on a
    # developer laptop with a `shiftwork_ref.py` child stuck and NO output at all — the run
    # was killed by hand, and alone it finishes in about two minutes. Neither the harness
    # nor `pytest` sets a per-child timeout, so nothing below this line would ever have
    # ended the run: GitHub's default is 360 minutes, which is six hours of runner time
    # spent to learn nothing, on a matrix of four cells, per push.
    #
    # 30 is an order of magnitude above the slowest honest reading (the Windows cells are
    # the slow ones and they finish in single-digit minutes), so this cannot fail a run
    # that is merely slow. It is a deadline, not a budget: if it ever fires, read it as
    # "something is stuck" and go looking for the child, not as "raise the number".
    timeout-minutes: 30
    # W1: the emitting half of the encoding gate. `EncodingWarning` is raised only when
    # the interpreter is started with this on, and it CANNOT be set from pytest's
    # `addopts` (`-X` is an interpreter flag; pytest exits 4 on it). `filterwarnings` in
    # runtime-py/pyproject.toml turns what this emits into a failure, and
    # tests/test_encoding_gate.py goes red if this line is ever removed from a CI run --
    # without that node, deleting this line would leave the whole gate green and blind.
    env:
      PYTHONWARNDEFAULTENCODING: "1"
    strategy:
      fail-fast: false
      matrix:
        # Four jobs. `fail-fast: false` is load-bearing: the Windows readings are the
        # product here, and cancelling siblings on the first red would throw away three
        # quarters of the measurement to save a few runner-minutes.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The perturbation bar reads rubric variants as `git:<ref>:<path>`, and its
          # tests pin real refs (d2f78b7, e57f1a6). A depth-1 checkout has neither, so
          # those tests either fail outright or silently skip the thing they exist to
          # check. Full history is the only way CI actually runs them.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "runtime-py[dev,mcp]"
      - name: Lint package
        run: ruff check .
        working-directory: runtime-py
      - name: Lint examples
        run: ruff check --config runtime-py/pyproject.toml examples
      - name: Test
        run: python -m pytest runtime-py -q

  node:
    # N9: the npm package had never been executed by anything except one laptop.
    #
    # WHY THIS IS A SECOND JOB AND NOT FOUR MORE CELLS ON `test`. The Python job's axis is
    # the Python version; this one's is the NODE version. Folding them together would
    # multiply to eight cells to measure four things, and would tie a Node regression to a
    # Python matrix that has nothing to say about it. Two jobs, four cells each.
    #
    # WHY THE LOW CELL IS 18 AND NOT SOMETHING COMFORTABLE. `runtime-ts/package.json`
    # declares `engines.node: ">=18"`. That is a promise made to a teammate whose `node -v`
    # nobody here controls, and until this job existed it had never been tested by anything:
    # every number in job38 was taken on v25.2.1. The floor is the thing worth measuring, so
    # the floor is what the matrix runs. 22 is the upper cell because it is the current LTS
    # a team is most likely to actually be on.
    #
    # WHY THERE IS A PYTHON HERE. The gate is `npm test` AND the conformance harness, and
    # the harness produces its REFERENCE side by shelling out to CPython (see the header of
    # tools/conformance/run.mjs). That is a dev-time dependency of the test tooling and not
    # a runtime one: nothing under `tools/` ships, `runtime-ts` declares
    # `files: ["dist", "assets"]`, and `npm test` never invokes the harness. A cell without
    # a Python could still run `npm test`, but it would be asserting that the port matches
    # CPython without ever running CPython, which is the exact check that has never once
    # caught the difference that mattered.
    #
    # WHAT THIS JOB DOES **NOT** RUN, AND WHY.
    #   * tools/conformance/npx-cold-start.mjs. It resolves from the PUBLIC registry, and
    #     `bantamkit-mcp` is not published (`npm view bantamkit-mcp` -> E404), so on a
    #     shared runner it is a network dependency in front of a name that does not resolve.
    #     N8 MEASURED the offline arm at 140-590 s before it says anything. A gate that can
    #     hang for ten minutes on somebody else's network outage is a gate people learn to
    #     re-run rather than read. It stays a hand-run install gate until there is a
    #     published tarball for it to reach, and then it belongs on a release workflow, not
    #     on every push.
    #   * A separate packaging step. There is no need for one: `test/packaging.test.mjs` is
    #     inside `npm test` and it shells `npm pack --dry-run --json`, which RUNS `prepack`
    #     and therefore `scripts/sync-assets.mjs`. That pack gate is already in this job,
    #     offline, and it is asserted against what npm would publish rather than against
    #     the checkout.
    #
    #     AMENDED 2026-08-25. This sentence used to call it "the 83-file / 212,480-byte
    #     pack gate", in the present tense, and BOTH halves misdescribed it. What
    #     `test/packaging.test.mjs` actually pins is `EXPECTED_ASSET_FILES = 84`, and it
    #     asserts NO byte total at all. The 83/212,480 pair is real but PAST: it is the
    #     pack as it stood before U11 added `assets/tools/bantamkit_status.json`, and
    #     `packaging.test.mjs:35` states it that way ("83 files / 212,480 bytes BEFORE
    #     it"), which is correct where this was not.
    #
    #     MEASURED at this commit, `npm pack --dry-run --json` in `runtime-ts/`:
    #     entryCount 137, size 272,928, unpackedSize 929,070, 84 files under `assets/`.
    #     The TARBALL SIZE is deliberately not written into the gate and should not be
    #     written into a record either: 272,922 was measured at 21ed692 and 272,928 at
    #     59a0b75 with no source change between them, so it moves on its own. The asset
    #     COUNT is the number that must not move silently — it is what `build_identity`
    #     hashes into `assets_digest` and therefore into `build_id`.
    #
    # WHAT IS DELIBERATELY ABSENT. No PYTHONWARNDEFAULTENCODING here: that variable is the
    # emitting half of the PYTHON encoding gate and belongs to the `test` job that owns it.
    # Setting it here would emit EncodingWarning from the harness's reference scripts, whose
    # stderr nobody reads, and would buy exactly nothing. And, as on the job above: no UTF-8
    # mode flags, and no Node-side equivalent of one.
    #
    # HOW TO TELL THIS RAN. Same rule as the job above, and it needs saying twice because
    # the trap is different here. `node --test`'s default reporter is NOT stable across the
    # versions `engines` claims -- 18/20/22 print TAP, 25 prints spec -- so
    # `scripts/run-tests.mjs` pins `--test-reporter=tap` whenever `CI` is set. That makes
    # `# pass <n>` the line to look for, on every cell, for as long as the matrix lives.
    # Read it, and read the Conformance step's `PASS: <n> cases` line: BOTH numbers must be
    # nonzero on all four cells. A step that never ran prints no summary at all.
    #
    # KEEP WINDOWS BEHAVIOUR OFF THE RUNNER'S CRITICAL PATH.
    #
    # The first armed run of these cells found seven separate families of Windows
    # difference, and three of them were pure PATH ALGEBRA -- which `ntpath` and
    # `PureWindowsPath` compute identically on every operating system. So the port's Windows
    # path arms are flavour-explicit functions (`ntSplitRoot`, `parseWindowsPath`, `ntJoin`,
    # `winFormat`) driven against CPython by `store.mjs`'s `ntpath.splitroot and
    # PureWindowsPath parsing` case, which runs on EVERY cell including a laptop. That case
    # caught `///a` being reported absolute -- pathlib's test is a SUBSTRING test and the
    # empty string is a substring of everything -- before any CI cycle was spent on it.
    #
    # A Windows arm reachable only through `process.platform` is a seven-minute edit loop;
    # the same arm behind a flavour-explicit function is a one-second one. Put new Windows
    # behaviour on that side of the line, and give it a case that runs everywhere.
    #
    # Both Node versions give the IDENTICAL result on each OS, which is the finding about
    # Node: nothing here is version-dependent, and `engines.node: ">=18"` survived contact
    # with 18 (see the fixture note in runtime-ts/test/assets.test.mjs for the one thing
    # that did not, and it was the fixture).
    runs-on: ${{ matrix.os }}
    # The deadline, for the reason spelled out on the `test` job — and this is the job the
    # measured hang was actually in. The conformance harness spawns a reference child per
    # session and waits on it with no timeout of its own, so a stuck child is invisible
    # from here: no output, no error, nothing but a job that never ends.
    timeout-minutes: 30
    strategy:
      # Load-bearing for the same reason as the job above: the Windows readings ARE the
      # product, and cancelling siblings on the first red throws three of them away.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ["18", "22"]
    steps:
      - uses: actions/checkout@v4
        # Depth 1 on purpose, unlike the job above. That job needs history because the
        # perturbation bar pins real refs; nothing here reads a ref. The suites do call
        # `git rev-parse --git-common-dir`, which a depth-1 checkout answers fine.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: runtime-ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          # One Python, pinned: this job's axis is Node. The Python axis is the job above.
          python-version: "3.12"
      - name: Install the reference side
        run: pip install -e "runtime-py[dev,mcp]"
      - name: Name the reference interpreter
        # `findPython()` in run.mjs looks for a repo `.venv`, which CI does not have, and it
        # requires a PATH, not a name. Hand it the absolute path of the interpreter that was
        # just installed into, so the harness compares against THIS runner's CPython instead
        # of dying on a venv that was never created. `shell: bash` so one line serves both
        # operating systems.
        shell: bash
        run: python -c "import sys; print('BANTAMKIT_CONFORMANCE_PYTHON=' + sys.executable)" >> "$GITHUB_ENV"
      - name: Install
        run: npm ci
        working-directory: runtime-ts
      - name: Test
        # `pretest` builds; a type error fails here.
        run: npm test
        working-directory: runtime-ts
      - name: Conformance
        # `!cancelled()` so this runs even when `npm test` went red. The two gates measure
        # different things -- one is the port against its own written-down expectations,
        # the other is the port against CPython -- and a run that reports only the first
        # because the first failed costs a whole CI cycle to learn the second. A red here
        # still fails the job; `if` changes what gets MEASURED, never what gets required.
        if: ${{ !cancelled() }}
        # No real fact store exists on a runner, so the corpus-backed suites fall back to
        # their adversarial sets and SAY SO in their notes ("real corpus: NOT FOUND"). Read
        # those notes: this cell measures fewer cases than a laptop does, on purpose, and
        # the alternative -- shipping the operator's own facts into CI -- is not one.
        run: node tools/conformance/run.mjs --all
