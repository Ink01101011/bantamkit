# bantamkit's host file for ts2py (#337): everything bantamkit-specific the compiler reads.
# The compiler (tools/ts2py) holds no bantamkit name; it is handed this file with `--config`.
#
# generator keeps the bytes of runtime-py/src/bantamkit/_generated/ exactly as they were before
# the compiler became its own package (J90-PKG). shipped_note names where the two support
# modules' documented sources live since then: the runtime's is tools/ts2py/python/ts2py/runtime.py
# and the adapters' is adapters.py beside this file (J90-D repointed it from tools/ts2py/src/;
# it is the one line of _ts2py_runtime.py and _ts2py_adapters.py that changed).
generator = "tools/ts2py"
shipped_note = "# Shipped form (J90-P2): comments are in tools/ts2py/python/ts2py/ and tools/ts2py-bantamkit/."
adapter_source = "adapters.py"

# J90-P7 (#316 G4): a module-level name of a generated module that hand-written Python rebinds or
# a test patches; read at call time under mypyc too (`Rebound` in tools/ts2py/src/host.rs).
[[rebound]]
module = "memory/component.ts"
name = "MemoryStore"
why = "memory/component.py builds every store layer through `_g.MemoryStore = _Core`."

[[rebound]]
module = "memory/component.ts"
name = "UsageLedger"
why = "memory/component.py builds the usage ledger through `_g.UsageLedger = _ledger`."

[[rebound]]
module = "memory/component.ts"
name = "profile_store"
why = "memory/component.py rebinds `_g.profile_store` when a caller sets `_profile_store`."

[[rebound]]
module = "storage/logsegment.ts"
name = "exclusive"
why = "tests/test_storage_log.py patches the log segment's `exclusive` with a spy."

# The adapter seam (J86): an import (or a Node global) that ts2py does not compile resolves to
# hand-written Python in adapters.py, and only through a row here. Every row says why the
# hand-written function is faithful: Python IS the reference (the TypeScript is a port of a
# CPython behaviour), or the row reproduces a Node builtin and names the measurement that pins it
# (tools/ts2py/RULES.md, Adapters).

[[adapter]]
module = "runtime-ts/src/memory/pyfs.ts"
name = "pyFloatRepr"
py_name = "py_float_repr"
kind = "function"
why = "Python is the reference: the TypeScript is a port of CPython's `repr(float)` (its doc comment says so), so `repr(float(x))` is the definition it ports. pyfs.ts is the 1,687-line CPython OS seam and is not compiled."

[[adapter]]
module = "runtime-ts/src/pysem.ts"
name = "pyStrip"
py_name = "py_strip"
kind = "function"
why = "Python is the reference: `pyStrip` is CPython's `str.strip()` with no argument (pysem.ts measured its 29-character set against `str.isspace()` over every codepoint). It is built from a regex assembled at run time with a `$&` replacement, which ts2py refuses to compile; J86 re-measured it against `str.strip()` (RULES.md, Adapters)."

[[adapter]]
name = "TextDecoder"
py_name = "TextDecoder"
kind = "class"
methods = ["decode"]
why = "Node builtin: `new TextDecoder('utf-8').decode(bytes)` is WHATWG UTF-8 decode (one U+FFFD per maximal invalid subpart, a leading BOM dropped). Python's `bytes.decode('utf-8', 'replace')` substitutes the same maximal subparts; J86 measured the two equal on a byte corpus (RULES.md, Adapters). J88-2: `{fatal: true}` refuses exactly where `bytes.decode('utf-8')` (strict) raises, as Node's TypeError ERR_ENCODING_INVALID_ENCODED_DATA, and `{ignoreBOM: true}` keeps the BOM; 40,000 random byte strings equal against Node 26.13 (RULES.md, Adapters)."

[[adapter]]
name = "Date"
py_name = "Date"
kind = "class"
methods = ["getFullYear", "getMonth", "getDate"]
why = "Python is the reference: the only use is `todayLocal`, whose doc comment defines it as `date.today().isoformat()` (local). The adapter is `new Date()` (no argument) with the three local calendar getters, read from `datetime.datetime.now()`."

