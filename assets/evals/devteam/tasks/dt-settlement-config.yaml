  README.md: '# svc-ledger


    Double-entry ledger service. Three handlers, one settings module, no globals.


    - Module map and the call order between modules: `docs/architecture.md`

    - Operating procedure, escalation, and where the tunables live: `docs/runbook.md`

    - Release history, newest first, with commit ids: `HISTORY.md`

    - Patch files for selected commits: `patches/`

    - Open incidents, including captured tracebacks: `issues/`


    Handlers are resolved at import time from `src/ledger/registry.py`. Nothing else

    in the service knows the handler names.

    '
  docs/architecture.md: "# Architecture\n\nThe three entry points are the handlers listed in `src/ledger/registry.py`.\n\
    \n- `settle.py` drives a batch. It wraps `posting.post_entry` in\n  `retry.with_retry`, and raises\
    \ its own error when a batch is too large.\n- `posting.py` writes one entry. It validates first, via\n\
    \  `validate.validate_entry`, and defines no exception of its own.\n- `report.py` renders a summary.\
    \ It reads the registry and imports no handler.\n- `validate.py` is the only module that decides an\
    \ entry is malformed.\n- `errors.py` defines every exception class in the service. No other module\n\
    \  declares one.\n\nEvery tunable is a key in `src/ledger/config.py`; that module is the only one\n\
    that touches `os.environ`. Modules ask `load_settings()` for values, so an\nattribute read on a `Settings`\
    \ object is how you tell that a module consumes a\nconfig key.\n"
  docs/runbook.md: '# Runbook


    Attempt counts, backoff intervals and batch sizes are **not written on this

    page** and never will be. Every one of them is a key with its default in

    `src/ledger/config.py` — read that file for the current value. Do not answer an

    operational question about a number from this page; it will be stale.


    Escalation: three consecutive settlement failures page the on-call. Foreign

    currency entries are converted, not rejected. A malformed entry is a caller bug

    and is never retried past the wrapper''s own attempt budget.

    '
  issues/142-settlement-timeout.md: "# 142 — settlement aborts on a zero-amount entry\n\nReported by ops\
    \ on 2026-08-02 against `main` (`9f2c1ab`). One entry in a batch\nof 40 carried `amount: 0`; the whole\
    \ batch aborted after the wrapper exhausted\nits attempts. Captured traceback, verbatim from the worker\
    \ log:\n\n```\nTraceback (most recent call last):\n  File \"src/ledger/settle.py\", line 15, in settle_batch\n\
    \    posted.append(with_retry(post_entry, entry))\n  File \"src/ledger/retry.py\", line 17, in with_retry\n\
    \    raise last\n  File \"src/ledger/posting.py\", line 9, in post_entry\n    validate_entry(entry)\n\
    \  File \"src/ledger/validate.py\", line 13, in validate_entry\n    raise ValidationError(f\"amount\
    \ must be non-zero: {entry!r}\")\nledger.errors.ValidationError: amount must be non-zero: {'amount':\
    \ 0, 'ccy': 'EUR'}\n```\n\nOps question: which change put this check in, and should a caller bug really\n\
    burn the whole attempt budget? Runbook says a malformed entry is never retried\npast the wrapper's\
    \ budget, so behaviour matches the runbook; the argument is\nabout whether the budget should apply\
    \ at all.\n"
  patches/0009-retry-budget.patch: "From 9f2c1ab5e2d84c1f0a7b6935cc41d0e2a8f37b41 Mon Sep 17 00:00:00\
    \ 2001\nDate: Wed, 29 Jul 2026 09:14:02 +0000\nSubject: [PATCH] fix(retry): read retry_max_attempts\
    \ from settings, not the\n constant\n\nThe wrapper had its own hard-coded attempt count, so raising\
    \ the deployed\nbudget changed nothing. It now asks load_settings() like every other module.\n---\n\
    \ src/ledger/retry.py | 8 +++++---\n 1 file changed, 5 insertions(+), 3 deletions(-)\n\ndiff --git\
    \ a/src/ledger/retry.py b/src/ledger/retry.py\n--- a/src/ledger/retry.py\n+++ b/src/ledger/retry.py\n\
    @@ -1,14 +1,15 @@\n-\"\"\"Retry wrapper. Attempts are fixed at the module constant below.\"\"\"\n\
    +\"\"\"Retry wrapper. Reads its attempt count from settings, never from a constant.\"\"\"\n\n import\
    \ time\n\n-_MAX_ATTEMPTS = 3\n+from ledger.config import load_settings\n\n\n def with_retry(fn, *args):\n\
    +    settings = load_settings()\n     last = None\n-    for _attempt in range(_MAX_ATTEMPTS):\n+ \
    \   for _attempt in range(settings.retry_max_attempts):\n         try:\n             return fn(*args)\n\
    \         except Exception as exc:\n             last = exc\n-            time.sleep(0.25)\n+    \
    \        time.sleep(settings.retry_backoff_ms / 1000)\n     raise last\n--\n2.45.2\n"
  src/ledger/__init__.py: '"""svc-ledger: a double-entry ledger service."""


    __version__ = "0.9.0"

