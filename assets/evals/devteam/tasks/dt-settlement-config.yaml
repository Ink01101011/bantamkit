    \        post_entry({\"amount\": 0, \"ccy\": \"EUR\"})\n\n\ndef test_post_entry_converts_foreign_currency():\n\
    \    assert post_entry({\"amount\": 10, \"ccy\": \"USD\"})[\"status\"] == \"converted\"\n"
  tests/test_settle.py: "import pytest\n\nfrom ledger.errors import SettlementError\nfrom ledger.settle\
