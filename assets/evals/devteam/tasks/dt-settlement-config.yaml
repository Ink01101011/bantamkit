  src/ledger/config.py: "\"\"\"The only module in svc-ledger that reads os.environ.\n\nEvery tunable is\
    \ a key in CONFIG_KEYS with its default beside it. docs/runbook.md\ndeliberately does not repeat these\
    \ values: one place, one default.\n\"\"\"\n\nimport os\n\nCONFIG_KEYS = {\n    \"retry_max_attempts\"\
    : 5,\n    \"retry_backoff_ms\": 250,\n    \"settle_batch_size\": 200,\n    \"posting_currency\": \"\
    EUR\",\n    \"report_top_n\": 10,\n}\n\n\nclass Settings:\n    \"\"\"Attribute access over CONFIG_KEYS,\
    \ environment first.\"\"\"\n\n    def __init__(self, values):\n        self.values = values\n\n  \
    \  def __getattr__(self, name):\n        if name not in self.values:\n            raise AttributeError(f\"\
    unknown config key: {name}\")\n        return self.values[name]\n\n\ndef load_settings():\n    values\
    \ = {}\n    for key, default in CONFIG_KEYS.items():\n        raw = os.environ.get(\"LEDGER_\" + key.upper())\n\
    \        values[key] = type(default)(raw) if raw is not None else default\n    return Settings(values)\n"
  src/ledger/errors.py: "\"\"\"Exception hierarchy for svc-ledger. Every module raises from here.\"\"\"\
    \n\n\nclass LedgerError(Exception):\n    \"\"\"Base class. Nothing raises this directly.\"\"\"\n\n\
    \nclass ValidationError(LedgerError):\n    \"\"\"An entry failed validate_entry.\"\"\"\n\n\nclass\
    \ SettlementError(LedgerError):\n    \"\"\"A batch could not be settled.\"\"\"\n"
  src/ledger/posting.py: "\"\"\"Post one entry to the ledger. Validates before writing; raises nothing\
    \ itself.\"\"\"\n\nfrom ledger.config import load_settings\nfrom ledger.validate import validate_entry\n\
    \n\ndef post_entry(entry):\n    settings = load_settings()\n    validate_entry(entry)\n    if entry[\"\
    ccy\"] != settings.posting_currency:\n        return {\"status\": \"converted\", \"ccy\": settings.posting_currency}\n\
    \    return {\"status\": \"posted\", \"ccy\": entry[\"ccy\"]}\n"
  src/ledger/registry.py: "\"\"\"Handler registry. Resolved once at import time by the service entry point.\"\
    \"\"\n\nHANDLERS = {\n    \"settle\": \"ledger.settle:settle_batch\",\n    \"post\": \"ledger.posting:post_entry\"\
    ,\n    \"report\": \"ledger.report:build_report\",\n}\n"
  src/ledger/report.py: "\"\"\"Per-handler summary. Reads the registry; imports no handler and no settings.\"\
    \"\"\n\nfrom ledger.registry import HANDLERS\n\n\ndef build_report(rows):\n    ranked = sorted(rows,\
    \ key=lambda r: r[\"amount\"], reverse=True)\n    # Left over from 6b1a903: this 10 was never moved\
    \ into CONFIG_KEYS.\n    return {\"handlers\": sorted(HANDLERS), \"top\": ranked[:10]}\n"
  src/ledger/retry.py: "\"\"\"Retry wrapper. Reads its attempt count from settings, never from a constant.\"\
    \"\"\n\nimport time\n\nfrom ledger.config import load_settings\n\n\ndef with_retry(fn, *args):\n \
    \   settings = load_settings()\n    last = None\n    for _attempt in range(settings.retry_max_attempts):\n\
    \        try:\n            return fn(*args)\n        except Exception as exc:\n            last =\
    \ exc\n            time.sleep(settings.retry_backoff_ms / 1000)\n    raise last\n"
  src/ledger/settle.py: "\"\"\"Batch settlement. Drives posting through the retry wrapper.\"\"\"\n\nfrom\
    \ ledger.config import load_settings\nfrom ledger.errors import SettlementError\nfrom ledger.posting\
    \ import post_entry\nfrom ledger.retry import with_retry\n\n\ndef settle_batch(entries):\n    settings\
    \ = load_settings()\n    if len(entries) > settings.settle_batch_size:\n        raise SettlementError(f\"\
    batch of {len(entries)} exceeds settle_batch_size\")\n    posted = []\n    for entry in entries:\n\
    \        posted.append(with_retry(post_entry, entry))\n    return posted\n"
  src/ledger/validate.py: "\"\"\"Entry validation. The only module that decides an entry is malformed.\"\
    \"\"\n\nfrom ledger.errors import ValidationError\n\nREQUIRED_FIELDS = (\"amount\", \"ccy\")\n\n\n\
    def validate_entry(entry):\n    for field in REQUIRED_FIELDS:\n        if field not in entry:\n  \
    \          raise ValidationError(f\"missing field {field!r}: {entry!r}\")\n    if entry[\"amount\"\
    ] == 0:\n        raise ValidationError(f\"amount must be non-zero: {entry!r}\")\n    return entry\n"
  tests/test_posting.py: "import pytest\n\nfrom ledger.errors import ValidationError\nfrom ledger.posting\
