# PRE-REGISTERED by docs/eval-data/2026-08-20-document-read-bar.md, before any arm ran.
# `expected` was READ OUT OF the generated document (the same slice `answers:` names),
# never hand-written: the bar's gate G-1 rebuilds the fixture and fails the run if the
# two ever disagree.
# Cell LARGE-OUT. Corpus `inventory.xlsx`, 12,000 data rows, 258,129 extracted bytes
# (~64,532 est. tokens, 1.97x WORKER_NUM_CTX). The answer's data row is > 400 (it was
# > 570 as pre-registered; Amendment 1, 2026-08-20, moved the cut in), so it
# sits OUTSIDE the declared head truncation. The `paste` arm cannot answer here
# by construction. This is the cell that carries the job's claim.
name: doc-large-out-8022
family: document-read
tools: []
document_setup:
  - path: inventory.xlsx
    seed: 4021
    sheets:
      - name: stock
        rows: 12000
        columns:
          - {name: sku, kind: key, prefix: 'SKU-', width: 6}
          - {name: region, kind: choice, values: [north, south, east, west]}
          - {name: units, kind: int, low: 1000, high: 9999}
    answers:
      question_sku: stock!A8023
      expected_region: stock!B8023
      expected_units: stock!C8023
prompt: >-
  A workbook is attached to this task. Its sheet `stock` has the columns sku, region
  and units, one row per sku. Find the single row whose sku is exactly SKU-008022 and
  report that row's region and units. Do not compute anything and do not summarise the
  sheet; read the one row. Answer with ONLY this JSON, nothing else:
  {"region": "<region>", "units": <integer>}
scoring:
  kind: json_equal
  expected:
    region: south
    units: 8935
