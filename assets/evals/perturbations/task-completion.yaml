rubric: task-completion
spec: docs/superpowers/specs/2026-08-11-perturbation-bar-spec.md
note: 'Perturbation family for the RB-P14 bar. Measurement input, NOT a Contract asset: no product code
  path loads it, and criticreplay.py is its only reader. Every point is a declared, text-anchored transformation
  with a stable rule id, applicable to any template that contains its anchor, so the same family lands
  on every rubric variant under comparison. A point whose anchor is absent from a variant is dropped from
  BOTH families of a pairwise comparison and named in the summary.'
requirement_inventory_note: 'The requirement inventory of the AS-FILED task-completion rubric (spec section
  3.3 step 1), committed before any paraphrase was authored. Admissibility test for every P point: re-derive
  this list from the perturbed text alone; it must come out the same - same count, same directive per
  item, same bands, same key names. A variant that changes the inventory (C-attempted adds a required
  `reasoning` key) is a different rubric under test, not a perturbation.'
requirement_inventory:
- Judge whether the information the task asks for is present and correct.
- Do not deduct for formatting.
- Do not deduct for phrasing.
- Do not deduct for extra surrounding text.
- Do not deduct for hedging.
- Do not deduct for verbosity.
- Facts present and right => the task is complete.
- A refusal or decline => 0-4, however polite.
- Hedging instead of an answer => missing content; hedging around an answer => fine.
- 'Bands: 9-10 present and correct; 5-8 partial or missing pieces; 0-4 wrong or absent.'
- Output only JSON with keys score (int) and feedback (string).
materialized_variants:
  A-asfiled:
    source: git:d2f78b7:assets/rubrics/task-completion.yaml
    note: byte-identical to the shipped assets/rubrics/task-completion.yaml
    base_sha256: e018854368c1b675e7cff5109a3dce715d59c86d871cd3d1d83b9083188a065e
  B-nonewline:
    source: A-asfiled with the template's single trailing newline removed
    note: 'materialize as the same YAML with `prompt: |-`'
    base_sha256: d1f32ad2947b4d6f6079833847eae96c79fddeb2683ceda322940bdc8cbf13a6
  C-attempted:
    source: git:e57f1a6:assets/rubrics/task-completion.yaml
    note: the withdrawn derive-before-score rubric; requires `reasoning` on the wire
    base_sha256: 5f588e4a07a6fa29572ed2e3bdbd39132c0a8f9908b0ce47408ad72c015d2298
