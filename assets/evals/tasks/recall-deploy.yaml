name: recall-deploy
family: memory-recall
prompt: 'How do we deploy this project to production? If you have a memory tool,
  check memory first. Answer with ONLY this JSON, nothing else: {"command": "<command>"}'
memory_setup:
- type: project
  name: deploy-command
  description: how we deploy this project to production
  body: Deploy with `make ship-prod` from the repo root.
scoring:
  kind: json_equal
  expected:
    command: make ship-prod
