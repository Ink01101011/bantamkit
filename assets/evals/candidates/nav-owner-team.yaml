name: nav-owner-team
family: file-nav
tools:
- read_file
- list_files
workspace:
  services.md: '# Service registry


    | service | ownership |

    |---|---|

    | checkout | see owners/checkout.txt |

    | billing | see owners/billing.txt |

    | search | see owners/search.txt |


    Ownership files are the single source of truth; this table is generated.'
  owners/checkout.txt: 'team: Meridian

    slack: #team-meridian

    oncall rotation: weekly

    '
  owners/billing.txt: 'team: Copper

    slack: #team-copper

    oncall rotation: biweekly

    '
  owners/search.txt: 'team: Harbor

    slack: #team-harbor

    oncall rotation: weekly

    '
  ci.md: '# CI pipeline notes


    The pipeline runs on every push: lint, unit tests, integration tests, and a

    packaging step. Caching of the dependency layer cut average build time from

    11 minutes to 6. Flaky tests are quarantined under tests/flaky/ and re-run

    three times before being reported as failures. The nightly job additionally

    runs the slow property-based suite and publishes coverage to the internal

    dashboard. Artifacts older than 30 days are pruned automatically. If a

    release tag is pushed, the pipeline also builds the signed bundle and

    uploads it to the artifact store with a 90-day retention override. Secrets

    are injected via the runner''s OIDC exchange; never commit tokens. When the

    integration environment is unavailable the pipeline degrades to unit tests

    only and marks the run amber, not red. Amber runs do not block merges but

    three consecutive ambers page the on-call.

    '
  style.md: '# Style guide (excerpt)


    Prefer small modules with one clear responsibility. Public functions carry

    docstrings describing behavior, not implementation. Errors are values where

    practical; exceptions for programmer mistakes. Log lines are structured

    key=value pairs, lowercase keys. Feature flags default off and are removed

    within two releases of full rollout. Database migrations are forward-only;

    rollbacks happen by writing a new migration. Review comments prefixed nit:

    are optional. Vendored code lives under third_party/ and is never edited in

    place — patch files only. Commit subjects use the imperative mood and stay

    under 68 characters. Squash-merge is the default; merge commits are for

    release branches only. Generated files carry a do-not-edit header and are

    regenerated in CI, never by hand.

    '
prompt: 'Which team owns the checkout service? Explore the workspace files to find out. Answer with ONLY this JSON, nothing else: {"team": "<name>"}'
scoring:
  kind: json_equal
  expected:
    team: Meridian
