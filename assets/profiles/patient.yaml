# Default, but with a longer turn budget: for models that need more steps than
# the 4b-calibrated default (measured: 3b file-nav and 7b recall died of turn
# exhaustion under max_turns 10). Calibration-only until a bar says otherwise.
name: patient
agent:
  max_turns: 16
  observation_budget: 4096
structured:
  max_retries: 3
schema_gate:
  max_attempts: 3
# One retry only: the gate rescues a missing-JSON restatement, and a second
# miss is format abandonment that more nagging does not fix (spec §2.4).
json_answer:
  max_attempts: 1
critique:
  max_rounds: 3
  evidence_budget: 4096
# Global spend governor (P3), applied only when a TokenBudget is attached.
# `ceiling` is the hard stop for one run; past `ceiling * optional_cutoff`
# optional work (critique rounds) is denied. The gap between the two IS the
# reserve that keeps the final answer emission affordable.
token_budget:
  ceiling: 6000
  optional_cutoff: 0.75
# Loop-detection thresholds, applied only when a LoopGuard is attached. Probe-
# calibrated: max observation-repeat streak in every passing run was 2, looping
# runs burned 6-16 — so the note fires at 3 and the hard warning at 5.
loop_guard:
  inject_at: 3
  warn_at: 5
